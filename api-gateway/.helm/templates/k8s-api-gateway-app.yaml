apiVersion: apps/v1
kind: Deployment # Kubernetes resource kind
metadata:
  name: api-gateway
spec:
  selector:
    matchLabels:
      app: api-gateway
  replicas: 3 # Number of replicas that will be created for this deployment
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # Gateway does not call the Kubernetes API; disable default SA token mount (Sonar/kubernetes best practice).
      automountServiceAccountToken: false
      containers:
        - name: api-gateway
          # Pin tag to release version (pom.xml); override at deploy time if your registry uses another tag.
          image: api-gateway:0.0.1-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080 # The port that the container is running on in the cluster
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 1536Mi
              ephemeral-storage: 256Mi

---

apiVersion: v1 # Kubernetes API version
kind: Service # Kubernetes resource kind
metadata: # Metadata of the resource kind
  name: api-gateway-service
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: "TCP"
      port: 8080 # The port that the service is running on in the cluster
      targetPort: 8080 # The port exposed by the service
  type: NodePort # Type of the service. Service types: NodePort, ClusterIp, LoadBalancer
