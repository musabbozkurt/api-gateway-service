services:

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: mb_modulith
      POSTGRES_USER: mb
      POSTGRES_PASSWORD: mb
    ports:
      - "5432:5432"

  redis:
    image: redis:8.10.3
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4.4.0-management
    ports:
      - "5672:5672"
      - "15672:15672"

  localstack:
    image: localstack/localstack:2026.10.4
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DEBUG: ${DEBUG:-1}
      DOCKER_HOST: unix:///var/run/docker.sock
      HOSTNAME: localstack
      HOSTNAME_EXTERNAL: localstack
      # Required by current LocalStack images (they exit with code 55 without a valid token).
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - "${TMPDIR:-/tmp}/localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  floci: # https://floci.io/floci/getting-started/migrate-from-localstack/
    image: floci/floci:latest # After — no init scripts, or init scripts that don't call aws / boto3
    # After — init scripts that use aws CLI or boto3 (AWS CLI + Python 3 + boto3 pre-installed)
    # image: floci/floci:latest-compat
    ports:
      - "4567:4566"
    environment:
      # These LocalStack vars are automatically translated — no extra config needed:
      PERSISTENCE: "1"                      # → FLOCI_STORAGE_MODE=persistent
      LOCALSTACK_HOST: floci                # → FLOCI_HOSTNAME=floci
      LAMBDA_DOCKER_NETWORK: mynet          # → FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK=mynet
      LAMBDA_REMOVE_CONTAINERS: "1"         # → FLOCI_SERVICES_LAMBDA_EPHEMERAL=true
      DEBUG: "1"                            # → QUARKUS_LOG_LEVEL=DEBUG

  minio:
    container_name: Minio
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  mb-modulith:
    profiles:
      - app
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - localstack
      - minio

volumes:
  minio-data:
