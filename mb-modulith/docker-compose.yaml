services:

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: mb_modulith
      POSTGRES_USER: mb
      POSTGRES_PASSWORD: mb
    ports:
      - "5432:5432"

  redis:
    image: redis:8.10.3
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4.4.0-management
    ports:
      - "5672:5672"
      - "15672:15672"

  mb-modulith:
    profiles:
      - app
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - redis
      - rabbitmq
