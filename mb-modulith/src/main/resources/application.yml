spring:
  application:
    name: mb-modulith
  docker:
    compose:
      enabled: true
      file: @docker.compose.file@
  datasource:
    url: jdbc:postgresql://localhost:5432/mb_modulith
    username: mb
    password: mb
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
      # Envers (revinfo, *_aud) lives in the email module schema.
      org.hibernate.envers.default_schema: email
  flyway:
    # Boot's single global Flyway is replaced by one Flyway per module (see ModuleFlywayConfig / app.flyway).
    enabled: false
  batch:
    jdbc:
      initialize-schema: always
  data:
    redis:
      host: localhost
      port: 6379
  autoconfigure:
    exclude:
      # Only the OAuth2 client (client_credentials for Feign) is used; the default OAuth2 login security chain would
      # conflict with the module security chains (WebSecurityConfig, LocalStackSecurityConfig).
      - org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration
  security:
    oauth2:
      client:
        provider:
          m2m-internal:
            token-uri: token-uri
        registration:
          m2m-internal:
            client-id: client-id
            client-secret: ${IDENTITY_CLIENT_SECRET:test}
            authorization-grant-type: client_credentials

amazon:
  aws:
    accessKey: ${AMAZON_AWS_ACCESS_KEY:test}
    secretKey: ${AMAZON_AWS_SECRET_KEY:test}
    region: eu-west-1
  dynamodb:
    endpoint: ${AMAZON_DYNAMODB_ENDPOINT:http://localhost:4566/}

minio:
  enabled: ${MINIO_STORAGE_ENABLED:true}
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  publicUrl: ${STORAGE_PUBLIC_URL:http://127.0.0.1:9000}
  accessKey: ${MINIO_ACCESS_KEY:admin}
  secret: ${MINIO_SECRET:supersecret}
  bucket: ${MINIO_BUCKET:test-bucket}
  microservicePrefix: storage_service/files/
  filePrefix: file-prefix

third-party-client-api:
  url: base-url

app:
  flyway:
    enabled: true
    # Existing module schemas (from the old public flyway_schema_history) get a module history table without re-running DDL.
    baseline-on-migrate: true
    # One Flyway per module: own location, own version line and own history table inside the module's schema.
    modules:
      - name: school
        schema: school
        location: classpath:db/migration/school
      - name: clinic
        schema: clinics
        location: classpath:db/migration/clinic
      - name: playermarket
        schema: player_market
        location: classpath:db/migration/playermarket
      - name: email
        schema: email
        location: classpath:db/migration/email
      - name: warehouse
        schema: warehouse
        location: classpath:db/migration/warehouse
      - name: commerce
        schema: commerce
        location: classpath:db/migration/commerce
      - name: delivery
        schema: delivery
        location: classpath:db/migration/delivery
      # localstack module is DynamoDB/S3 based: no relational schema, no Flyway migrations.

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls-primary-name: school-api
  api-docs:
    enabled: true
    path: /v3/api-docs

swagger:
  documentation:
    services:
      - name: school-api
        display-name: School Registration
      - name: clinic-api
        display-name: Clinic
      - name: playermarket-api
        display-name: Player Market
      - name: email-api
        display-name: Email
      - name: warehouse-api
        display-name: Food Warehouse
      - name: commerce-api
        display-name: Commerce
      - name: delivery-api
        display-name: Delivery logistics
      - name: localstack-api
        display-name: Local Stack

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  statsd:
    metrics:
      export:
        # No StatsD agent runs next to the app by default; set STATSD_METRICS_EXPORT_ENABLED=true (and the host) to use one.
        enabled: ${STATSD_METRICS_EXPORT_ENABLED:false}
        host: ${STATSD_HOST:localhost}

token:
  store: redis

testing:
  app:
    jwt-secret: testingSecretKeytestingSecretKeytestingSecretKey12
    jwt-expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.mb.modulith: INFO
