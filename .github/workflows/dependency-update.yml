# =============================================================================
# MB Dependency Version Update
# =============================================================================
# Detects and applies outdated versions for:
#   - Maven dependencies (versions-maven-plugin + version-rules.xml per service)
#   - Docker Compose images (docs/scripts/check-compose-image-updates.sh --apply)
#
# Behavior per trigger:
#   pull_request       → Read-only check: Maven update report + Compose image report
#   push (this file)   → Applies updates, verifies changed services compile, creates/updates PR
#   schedule/dispatch  → Same as push; if automated/dependency-updates PR is open, checks
#                        out that branch and pushes new commits instead of skipping
# =============================================================================

name: MB Dependency Version Update

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/dependency-update.yml" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight

permissions:
  contents: write
  pull-requests: write

env:
  UPDATE_BRANCH: automated/dependency-updates
  SERVICE_DIRS: >-
    api-gateway
    brokerage-provider
    gitlab-service
    inventory-management-service
    kafka-debezium-service
    notification-service
    openai-service
    payment-service
    stock-exchange-service
    service-registry
    spring-config-server
    student-service
    swagger-application

jobs:
  check-versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Check for available version updates
        run: |
          for service in $SERVICE_DIRS; do
            pom="$service/pom.xml"

            echo "::group::$service parent POM updates"
            mvn -B versions:display-parent-updates --file "$pom"
            echo "::endgroup::"

            echo "::group::$service property updates"
            mvn -B versions:display-property-updates --file "$pom"
            echo "::endgroup::"

            echo "::group::$service dependency updates"
            mvn -B versions:display-dependency-updates --file "$pom"
            echo "::endgroup::"
          done

      - name: Check Docker Compose image versions
        run: |
          chmod +x docs/scripts/check-compose-image-updates.sh
          ./docs/scripts/check-compose-image-updates.sh

  update-and-pr:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/making-authenticated-api-requests-with-a-github-app-in-a-github-actions-workflow
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Resolve update base branch
        id: update-base
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          OPEN_PR=$(gh pr list --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN_PR" ]; then
            echo "checkout_ref=$UPDATE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "pr_number=$OPEN_PR" >> "$GITHUB_OUTPUT"
            echo "Updating existing open PR #$OPEN_PR on branch $UPDATE_BRANCH."
          else
            echo "checkout_ref=main" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "No open dependency update PR; starting from main."
          fi

      - name: Checkout update base
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.update-base.outputs.checkout_ref }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Apply all version updates
        run: |
          for service in $SERVICE_DIRS; do
            pom="$service/pom.xml"
            mvn -B versions:update-parent -DgenerateBackupPoms=false --file "$pom"
            mvn -B versions:update-properties -DgenerateBackupPoms=false --file "$pom"
            mvn -B versions:use-latest-releases -DgenerateBackupPoms=false --file "$pom"
          done

      - name: Apply Docker Compose image updates
        run: |
          chmod +x docs/scripts/check-compose-image-updates.sh
          ./docs/scripts/check-compose-image-updates.sh --apply
          rm -f docker-compose.yml.bak

      - name: Check if dependency files changed
        id: diff
        env:
          PR_NUMBER: ${{ steps.update-base.outputs.pr_number }}
        run: |
          CHANGED_POMS=$(git diff --name-only | grep '/pom\.xml$' || true)
          COMPOSE_CHANGED=false
          if git diff --name-only | grep -qx 'docker-compose.yml'; then
            COMPOSE_CHANGED=true
          fi

          if [ -z "$CHANGED_POMS" ] && [ "$COMPOSE_CHANGED" != "true" ]; then
            echo "All Maven and Docker Compose dependencies are up to date."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "has_pom_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            if [ -n "$CHANGED_POMS" ]; then
              echo "has_pom_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_pom_changes=false" >> "$GITHUB_OUTPUT"
            fi
            {
              echo 'changed_poms<<EOF'
              printf '%s\n' "$CHANGED_POMS"
              echo 'EOF'
              echo 'compose_changed<<EOF'
              echo "$COMPOSE_CHANGED"
              echo 'EOF'
              echo 'body<<EOF'
              echo '## 🔄 MB Dependency Version Updates'
              echo ''
              echo 'This PR was automatically created or updated by the **MB Dependency Version Update** workflow.'
              if [ -n "$PR_NUMBER" ]; then
                echo ''
                echo "_Updated existing PR #$PR_NUMBER with new dependency bumps._"
              fi
              echo ''
              if [ -n "$CHANGED_POMS" ]; then
                echo '### Updated service POM files'
                while IFS= read -r pom; do
                  [ -n "$pom" ] || continue
                  echo "- \`$pom\`"
                done <<< "$CHANGED_POMS"
                echo ''
                while IFS= read -r pom; do
                  [ -n "$pom" ] || continue
                  echo "#### \`$pom\`"
                  echo '```diff'
                  git diff -- "$pom"
                  echo '```'
                  echo ''
                done <<< "$CHANGED_POMS"
              fi
              if [ "$COMPOSE_CHANGED" = "true" ]; then
                echo '### Updated docker-compose.yml images'
                echo '```diff'
                git diff -- docker-compose.yml
                echo '```'
                echo ''
              fi
              echo '### Checklist'
              echo '- [ ] Review the version changes above'
              echo '- [ ] Verify CI build passes'
              echo '- [ ] Check for breaking changes in release notes'
              if [ "$COMPOSE_CHANGED" = "true" ]; then
                echo '- [ ] Smoke-test updated container images locally'
              fi
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify changed services compile
        if: steps.diff.outputs.has_changes == 'true' && steps.diff.outputs.has_pom_changes == 'true'
        env:
          CHANGED_POMS: ${{ steps.diff.outputs.changed_poms }}
        run: |
          while IFS= read -r pom; do
            [ -n "$pom" ] || continue
            echo "::group::Compiling $pom"
            mvn -B compile --file "$pom"
            echo "::endgroup::"
          done <<< "$CHANGED_POMS"

      - name: Create or update Pull Request
        if: steps.diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "build(deps): update Maven and Docker Compose dependency versions"
          branch: ${{ env.UPDATE_BRANCH }}
          delete-branch: true
          title: "build(deps): update Maven and Docker Compose dependency versions"
          body: ${{ steps.diff.outputs.body }}
          labels: |
            dependencies
            automated
          reviewers: ${{ github.repository_owner }}
